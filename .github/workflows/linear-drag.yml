name: Linear Status -> Issue Boards

on:
  repository_dispatch:
    types: [linear_status_change]

permissions:
  contents: read
  issues: write

jobs:
  # Mirrors a Linear issue's workflow-state change onto the linked item's
  # Status field on that repo's "Issue Boards" project. Linear's own GitHub
  # integration already handles open <-> closed (Done maps to a closed issue
  # automatically); this covers every other state, which has no native
  # equivalent. "Duplicate" has no matching Status column on any board (and
  # can't be removed from Linear's own state list), so it becomes a
  # Condition:Duplicate label plus the Canceled status.
  #
  # To onboard another repo, add a case arm below with its project/field/
  # option IDs (onboard-linear-status-sync.yml does this automatically).
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.event.client_payload.owner }}
          REPO: ${{ github.event.client_payload.repo }}
          NUMBER: ${{ github.event.client_payload.issue_number }}
          NEW_STATUS: ${{ github.event.client_payload.new_status }}
        run: |
          set -e
          FULL_REPO="$OWNER/$REPO"

          # ── Per-repo Issue Boards project/field/option IDs ──────────────
          case "$FULL_REPO" in
            dbbuilder-org/billboard)
              PROJECT_ID="PVT_kwDODmqj9M4Be0uq"
              FIELD_ID="PVTSSF_lADODmqj9M4Be0uqzhZMFd8"
              OPT_BACKLOG="cdbc5f91"
              OPT_TODO="f75ad846"
              OPT_IN_PROGRESS="47fc9ee4"
              OPT_IN_REVIEW="9c0c29a2"
              OPT_BLOCKED="16765e6b"
              OPT_DONE="98236657"
              OPT_CANCELED="779953c4"
              ;;
            *)
              echo "No Issue Boards project registered for '$FULL_REPO' — skipping"
              exit 0
              ;;
          esac

          if [[ "$NEW_STATUS" == "Duplicate" ]]; then
            gh api repos/"$FULL_REPO"/labels -f name="Condition:Duplicate" -f color="cfd3d7" >/dev/null 2>&1 || true
            gh api repos/"$FULL_REPO"/issues/"$NUMBER"/labels -f "labels[]=Condition:Duplicate"
            NEW_STATUS="Canceled"
          fi

          # ── Status name -> that repo's option ID ─────────────────────────
          case "$NEW_STATUS" in
            Backlog)       OPT="$OPT_BACKLOG" ;;
            Todo)          OPT="$OPT_TODO" ;;
            "In Progress") OPT="$OPT_IN_PROGRESS" ;;
            "In Review")   OPT="$OPT_IN_REVIEW" ;;
            Blocked)       OPT="$OPT_BLOCKED" ;;
            Done)          OPT="$OPT_DONE" ;;
            Canceled)      OPT="$OPT_CANCELED" ;;
            *)             echo "Unknown status '$NEW_STATUS' — skipping"; exit 0 ;;
          esac
          if [[ -z "$OPT" ]]; then
            echo "'$NEW_STATUS' has no option ID registered for '$FULL_REPO' — skipping"
            exit 0
          fi

          NODE_ID=$(gh api repos/"$FULL_REPO"/issues/"$NUMBER" --jq '.node_id')

          ITEM_ID=$(gh api graphql -f query='
            mutation($proj: ID!, $content: ID!) {
              addProjectV2ItemById(input: { projectId: $proj, contentId: $content }) {
                item { id }
              }
            }' -f proj="$PROJECT_ID" -f content="$NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($proj: ID!, $item: ID!, $field: ID!, $opt: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $proj, itemId: $item,
                fieldId: $field, value: { singleSelectOptionId: $opt }
              }) { projectV2Item { id } }
            }' -f proj="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$FIELD_ID" -f opt="$OPT"
