name: DEBUG Linear schema introspect (temporary)

on:
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - name: Introspect relation mutation shapes
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          query() {
            jq -n --arg q "$1" '{query: $q}' | curl -s https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" -d @-
          }
          echo "=== IssueRelationCreateInput ==="
          query '{ __type(name: "IssueRelationCreateInput") { inputFields { name type { name kind ofType { name kind } } } } }' | jq .
          echo "=== IssueRelationType enum ==="
          query '{ __type(name: "IssueRelationType") { enumValues { name } } }' | jq .
          echo "=== issueRelationDelete mutation args ==="
          query '{ __type(name: "Mutation") { fields(includeDeprecated: false) { name args { name type { name kind ofType { name kind } } } } } }' | jq '.data.__type.fields[] | select(.name == "issueRelationDelete")'
          echo "=== issueUpdate parentId field (sanity check, already used elsewhere) ==="
          query '{ __type(name: "IssueUpdateInput") { inputFields { name type { name kind } } } }' | jq '.data.__type.inputFields[] | select(.name == "parentId")'
