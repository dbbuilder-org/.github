name: GitHub Sub-Issue -> Linear Parent

on:
  repository_dispatch:
    types: [github_sub_issue_change]

permissions:
  contents: read

jobs:
  # Mirrors a GitHub native sub-issue (parent/child) change onto the
  # linked Linear issue's parentId.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: dbbuilder-org/.github/.github/actions/write-linear-helpers@main
      - env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SUB_HTML_URL: ${{ github.event.client_payload.sub_html_url }}
          PARENT_HTML_URL: ${{ github.event.client_payload.parent_html_url }}
          ACTION: ${{ github.event.client_payload.action }}
        run: |
          source /tmp/linear-helpers.sh
          sync_linear_parent "$SUB_HTML_URL" "$PARENT_HTML_URL" "$ACTION"
