name: DEBUG check linear state (temporary)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: dbbuilder-org/.github/.github/actions/write-linear-helpers@main
      - env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          source /tmp/linear-helpers.sh
          linear_api 'query { issues(filter: { team: { key: { eq: "BB" } } }, first: 50) { nodes { identifier title parent { identifier } relations { nodes { type relatedIssue { identifier } } } inverseRelations { nodes { type issue { identifier } } } } } }' '{}' | jq '.data.issues.nodes[] | select(.identifier == "BB-137" or .identifier == "BB-136")'
